<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Section</title>

<style>
/* ===== CONTACT SECTION ===== */
.section-contact {
  padding: 100px 20px;
  position: relative;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%);
}

.section-contact::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg,
    rgba(59,130,246,0.1),
    rgba(236,72,153,0.1),
    rgba(16,185,129,0.1));
  animation: pulse 8s infinite alternate;
  transition: opacity 0.4s ease;
}

html.light-mode .section-contact::before {
  opacity: 0.25;
}

@keyframes pulse {
  0% { opacity: 0.6; }
  100% { opacity: 1; }
}

.contact-container {
  max-width: 1200px;
  margin: auto;
  position: relative;
}

.section-header {
  text-align: center;
  margin-bottom: 60px;
  opacity: 0;
  transform: translateY(30px);
  transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

.section-header.reveal {
  opacity: 1;
  transform: translateY(0);
}

.section-title {
  color: white;
  font-size: 42px;
  font-weight: 600;
  margin-bottom: 12px;
}

.section-subtitle {
  color: rgba(255,255,255,0.75);
  font-size: 18px;
}

html.light-mode .section-title { color: #0f172a; }
html.light-mode .section-subtitle { color: #475569; }

/* Contact Items */
.contact-info {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
  max-width: 700px;
  margin: 0 auto;
  opacity: 0;
  transform: translateY(40px);
  transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  transition-delay: 200ms;
}

.contact-info.reveal {
  opacity: 1;
  transform: translateY(0);
}

.contact-item {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 24px 28px;
  background: rgba(255,255,255,0.08);
  border-radius: 16px;
  text-decoration: none;
  color: inherit;
  transition: all 0.4s ease;
  border: 1px solid rgba(255,255,255,0.1);
}

.contact-item:hover {
  background: rgba(255,255,255,0.15);
  transform: translateY(-6px);
  border-color: rgba(255,255,255,0.3);
}

html.light-mode .contact-item {
  background: rgba(15,23,42,0.06);
  border-color: rgba(0,0,0,0.08);
}

html.light-mode .contact-item:hover {
  background: rgba(15,23,42,0.1);
}

.contact-icon {
  width: 54px;
  height: 54px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.3s ease;
}

.contact-item:hover .contact-icon {
  background: rgba(255,255,255,0.2);
  transform: scale(1.08);
}

html.light-mode .contact-icon {
  background: rgba(15,23,42,0.08);
}

.contact-label {
  font-size: 15px;
  color: rgba(255,255,255,0.7);
  font-weight: 500;
}

.contact-value {
  font-size: 18px;
  font-weight: 600;
  color: white;
}

html.light-mode .contact-label { color: #64748b; }
html.light-mode .contact-value { color: #0f172a; }

/* Responsive */
@media (min-width: 768px) {
  .contact-info {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>
<body>

<section class="section-contact" id="contact">

  <div class="contact-container">

    <div class="section-header">
      <h2 class="section-title">Get In Touch</h2>
      <p class="section-subtitle">Let's create something beautiful together</p>
    </div>

    <div class="contact-info">

      <a href="mailto:hello@capture.com" class="contact-item">
        <div class="contact-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
            <path d="M20 4H4C2.9 4 2 4.9 2 6V18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V6C22 4.9 21.1 4 20 4ZM20 8L12 13L4 8V6L12 11L20 6V8Z"/>
          </svg>
        </div>
        <div>
          <div class="contact-label">Email</div>
          <div class="contact-value">hello@capture.com</div>
        </div>
      </a>

      <a href="tel:+1234567890" class="contact-item">
        <div class="contact-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
            <path d="M6.62 10.79C8.06 13.62 10.38 15.94 13.21 17.38L15.41 15.18C15.69 14.9 16.08 14.82 16.43 14.93C17.55 15.3 18.75 15.5 20 15.5C20.55 15.5 21 15.95 21 16.5V20C21 20.55 20.55 21 20 21C10.61 21 3 13.39 3 4C3 3.45 3.45 3 4 3H7.5C8.05 3 8.5 3.45 8.5 4C8.5 5.25 8.7 6.45 9.07 7.57C9.18 7.92 9.1 8.31 8.82 8.59L6.62 10.79Z"/>
          </svg>
        </div>
        <div>
          <div class="contact-label">Phone</div>
          <div class="contact-value">+1 (234) 567-890</div>
        </div>
      </a>

      <a href="https://maps.google.com/?q=New+York+USA" target="_blank" rel="noopener" class="contact-item">
        <div class="contact-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
            <path d="M12 2C8.13 2 5 5.13 5 9C5 14.25 12 22 12 22S19 14.25 19 9C19 5.13 15.87 2 12 2ZM12 11.5C10.62 11.5 9.5 10.38 9.5 9S10.62 6.5 12 6.5S14.5 7.62 14.5 9S13.38 11.5 12 11.5Z"/>
          </svg>
        </div>
        <div>
          <div class="contact-label">Studio</div>
          <div class="contact-value">New York, USA</div>
        </div>
      </a>

    </div>

  </div>
</section>

<script>
/* Sync light/dark mode with parent */
function syncTheme() {
  try {
    const parentHtml = window.parent.document.documentElement;
    const isLight = parentHtml.classList.contains('light-mode');
    document.documentElement.classList.toggle('light-mode', isLight);
  } catch(e) {
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.add('light-mode');
    }
  }
}

syncTheme();

try {
  const themeObserver = new MutationObserver(syncTheme);
  themeObserver.observe(window.parent.document.documentElement, {
    attributes: true, attributeFilter: ['class']
  });
} catch(e) {}

/* Reveal Animation */
function initContactReveal() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        document.querySelector('.section-header').classList.add('reveal');
        document.querySelector('.contact-info').classList.add('reveal');
        observer.disconnect();
      }
    });
  }, { threshold: 0.2 });

  observer.observe(document.querySelector('.section-contact'));
}

document.addEventListener('DOMContentLoaded', initContactReveal);
</script>

</body>
</html>
